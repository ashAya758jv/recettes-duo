name: Third-Party and Custom Actions Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build info action
        id: info
        uses: ./.github/actions/build-info
        with:
          app-name: my-app

      - name: Print build id
        env:
          BUILD_ID: ${{ steps.info.outputs.build-id }}
        run: |
          printf 'Build id is %s\n' "$BUILD_ID"
          test "$BUILD_ID" = 'my-app-1.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print Node.js version
        run: node --version

      - name: Generate build report
        run: |
          printf 'Node.js: %s | Date (UTC): %s\n' \
            "$(node --version)" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > report.txt

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report

      - name: Print build report
        run: cat report.txt
